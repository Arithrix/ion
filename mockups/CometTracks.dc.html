<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comet tracks</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0E13}
a{color:#6CC5D9}a:hover{color:#9FDCEA}
button{font:inherit;border:0;cursor:pointer}
</style>
</helmet>
<div style="width: 620px; height: 712px; box-sizing: border-box; background: #0F1218; color: #D8DEE9; font-family: 'JetBrains Mono', ui-monospace, monospace; font-size: 16px; line-height: 21px; display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid #2A3140">
    <span style="color: #F0A04B; font-weight: 700; letter-spacing: 1px">ion</span>
    <span style="margin-left: auto; color: #8B95A7"><span style="color: #6CC5D9">▶</span> <span style="color: #D8DEE9">124.0</span> · cpu <span style="color: #D8DEE9">31%</span></span>
  </div>
  <div style="display: flex; gap: 4px; padding: 6px 12px; border-bottom: 1px solid #2A3140">
    <sc-for list="{{tabs}}" as="t" hint-placeholder-count="6">
      <button type="button" style="background: {{t.bg}}; color: {{t.fg}}; padding: 0 7px; line-height: 21px"><span style="color: {{t.kc}}; font-weight: 700">{{t.k}}</span>{{t.rest}}</button>
    </sc-for>
  </div>

  <section style="margin: 18px 12px 0; position: relative; border: 1px solid #F0A04B; padding: 12px 6px 6px">
    <span style="position: absolute; top: -11px; left: 10px; background: #0F1218; padding: 0 6px; color: #F0A04B; font-weight: 600">Tracks</span>
    <sc-for list="{{tracks}}" as="r" hint-placeholder-count="8">
      <div style="display: grid; grid-template-columns: 16px 50px minmax(0, 1fr) 70px 14px; gap: 8px; padding: 3px 6px; background: {{r.bg}}; color: {{r.fg}}">
        <span style="font-weight: 700">{{r.n}}</span>
        <span style="color: {{r.ec}}; font-weight: 600">{{r.eng}}</span>
        <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.sound}}</span>
        <span style="white-space: nowrap"><span style="color: {{r.meter}}">{{r.on}}</span><span style="color: {{r.off}}">{{r.offBar}}</span></span>
        <span style="color: {{r.ac}}">{{r.act}}</span>
      </div>
    </sc-for>
  </section>

  <section style="margin: 20px 12px 0; position: relative; border: 1px solid #39424F; padding: 12px 10px 8px; display: flex; flex-direction: column; gap: 2px">
    <span style="position: absolute; top: -11px; left: 10px; background: #0F1218; padding: 0 6px; color: #8B95A7; font-weight: 600">3 · FM</span>
    <div style="display: flex; justify-content: space-between"><span style="color: #6CC5D9; font-weight: 700">E.PIANO 1</span><span style="color: #F0A04B">★</span></div>
    <sc-for list="{{macros}}" as="m" hint-placeholder-count="3">
      <div style="display: grid; grid-template-columns: 80px minmax(0, 1fr) 36px; gap: 8px">
        <span>{{m.label}}</span>
        <span style="white-space: nowrap"><span style="color: #6CC5D9">{{m.on}}</span><span style="color: #39424F">{{m.off}}</span></span>
        <span style="text-align: right; color: #8B95A7">{{m.v}}</span>
      </div>
    </sc-for>
    <span style="color: #8B95A7">eq ● · comp ● · chorus ● · rev 45%</span>
  </section>

  <div style="margin-top: auto; display: flex; flex-wrap: wrap; row-gap: 4px; padding: 6px 12px 8px; border-top: 1px solid #2A3140">
    <sc-for list="{{hints}}" as="h" hint-placeholder-count="6">
      <span style="display: inline-flex; margin-right: 6px"><span style="color: #D8DEE9; font-weight: 700; padding: 0 4px">{{h.k}}</span><span style="background: #6CC5D9; color: #0F1218; padding: 0 6px">{{h.l}}</span></span>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":620,"height":712}}'>
class Component extends DCLogic {
  renderVals() {
    const tabNames = [['T', 'rk'], ['I', 'ns'], ['M', 'ix'], ['F', 'x'], ['R', 'ec'], ['L', 'ib']];
    const tabs = tabNames.map((t, i) => ({
      k: t[0], rest: t[1],
      bg: i === 0 ? '#F0A04B' : 'transparent',
      fg: i === 0 ? '#0F1218' : '#8B95A7',
      kc: i === 0 ? '#0F1218' : '#F0A04B'
    }));
    const engColor = { DRUM: '#F0A04B', FM: '#6CC5D9', SMPL: '#C3A6FF', PLTS: '#9BD48A', '—': '#5C6677' };
    const raw = [
      ['1', 'DRUM', 'Garage Kit 02', 5, true],
      ['2', 'DRUM', 'Perc Chops', 3, true],
      ['3', 'FM', 'E.PIANO 1', 4, true],
      ['4', 'FM', 'FM BASS 3', 6, true],
      ['5', 'SMPL', 'chords_124_4bar', 4, true],
      ['6', 'PLTS', 'String machine', 0, false],
      ['7', 'SMPL', 'vox_chop_A', 2, true],
      ['8', '—', '— empty —', 0, false]
    ];
    const sel = 2;
    const tracks = raw.map((r, i) => {
      const s = i === sel;
      return {
        n: r[0], eng: r[1], sound: r[2],
        on: '█'.repeat(r[3]), offBar: '░'.repeat(6 - r[3]),
        act: r[4] ? '●' : '·',
        bg: s ? '#F0A04B' : 'transparent',
        fg: s ? '#0F1218' : (r[1] === '—' ? '#5C6677' : '#D8DEE9'),
        ec: s ? '#0F1218' : engColor[r[1]],
        meter: s ? '#0F1218' : '#6CC5D9',
        off: s ? '#8A5A26' : '#39424F',
        ac: s ? '#0F1218' : (r[4] ? '#6CC5D9' : '#5C6677')
      };
    });
    const macros = [['Bright', 6, '62'], ['Release', 5, '48'], ['Feedbk', 3, '30']]
      .map(m => ({ label: m[0], on: '█'.repeat(m[1]), off: '░'.repeat(12 - m[1]), v: m[2] }));
    const hints = [['↑↓', 'Move'], ['⏎', 'Edit'], ['/', 'Find'], ['m', 'Mute'], ['s', 'Solo'], ['?', 'Help']]
      .map(h => ({ k: h[0], l: h[1] }));
    return { tabs, tracks, macros, hints };
  }
}
</script>
</body>
</html>
